paths:
  /api/warehouse/:location_code:
    get:
      consumes:
      - application/json
      description: Search location by location code, customer, technician, warehouse
      parameters:
      - description: name search by q
        format: email
        in: query
        name: q
        type: string
      - description: Location code
        in: path
        name: location_code
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Search location by location code
      tags:
      - location warehouse customer technician
  /test-init/{transaction_id}:
    get:
      consumes:
      - application/json
      description: Call Test Init after construct code for swagger init
      parameters:
      - description: Transaction Id
        in: path
        name: transaction_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.CalTestInitResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Test init for swagger docs
      tags:
      - callany
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
